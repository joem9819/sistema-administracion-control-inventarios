<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Sistema de Administración y Control de Inventarios">
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="52%" stop-color="#0f3b38"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="linea" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0"/>
    </linearGradient>
    <pattern id="puntos" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#ffffff" fill-opacity="0.10"/>
    </pattern>
  </defs>

  <rect width="1200" height="320" rx="18" fill="url(#fondo)"/>
  <rect width="1200" height="320" rx="18" fill="url(#puntos)"/>

  <g transform="translate(72 96)">
    <rect x="0" y="0" width="54" height="5" rx="2.5" fill="url(#linea)"/>
    <text x="0" y="62" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="52" font-weight="700" fill="#ffffff">
      Gestión de Inventario
    </text>
    <text x="2" y="104" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="21" fill="#99f6e4">
      Supermercado con varias sucursales · Python · Flask · MySQL
    </text>
    <text x="2" y="140" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" fill="#ffffff" fill-opacity="0.55" letter-spacing="2.5">
      PROYECTO INTEGRADOR EN SOFTWARE LIBRE · ITM
    </text>
  </g>

  <g opacity="0.95" stroke="#5eead4" stroke-width="2.5" stroke-linejoin="round">
    <g transform="translate(948 196)">
      <polygon points="0,-30 60,0 0,30 -60,0" fill="#14b8a6" fill-opacity="0.55"/>
      <polygon points="-60,0 0,30 0,90 -60,60" fill="#0f766e" fill-opacity="0.75"/>
      <polygon points="0,30 60,0 60,60 0,90" fill="#0d9488" fill-opacity="0.6"/>
    </g>
    <g transform="translate(1072 126)">
      <polygon points="0,-24 48,0 0,24 -48,0" fill="#2dd4bf" fill-opacity="0.5"/>
      <polygon points="-48,0 0,24 0,72 -48,48" fill="#0f766e" fill-opacity="0.7"/>
      <polygon points="0,24 48,0 48,48 0,72" fill="#0d9488" fill-opacity="0.55"/>
    </g>
    <g transform="translate(948 76)">
      <polygon points="0,-24 48,0 0,24 -48,0" fill="#99f6e4" fill-opacity="0.45"/>
      <polygon points="-48,0 0,24 0,72 -48,48" fill="#115e59" fill-opacity="0.7"/>
      <polygon points="0,24 48,0 48,48 0,72" fill="#0d9488" fill-opacity="0.5"/>
    </g>
  </g>
</svg>
